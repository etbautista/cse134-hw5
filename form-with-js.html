<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ethanbautista.dev</title>
    <link rel="icon" href="public/assets/icons/signature.svg"/>
    <link rel="stylesheet" href="style.css" />
    <style>
        horizontal-container {
            display: flex;
            flex-direction: row;
        }
    </style> 
    <script>
        const savedTheme = localStorage.getItem("theme") || "light"

        console.log(savedTheme)
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>
<body>
    <footer>
        <h2>Let's Keep in Touch :)</h2>
        <p>Fill out the contact form below with your name, email, and message. Please keep names and emails from 1 to 100 characters and messages from 10 to 1000 characters. </p>
        <form action="https://httpbin.org/post" method="post">
                <form-field>
                    <horizontal-container>
                        <label for="name">name</label>
                        <small class="err-star">*</small>
                    </horizontal-container>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="your name" 
                        autocomplete="name" 
                        minlength="1" 
                        maxlength="100" 
                        aria-describedby="name-err"
                        aria-invalid="false"
                        required
                    >
                    <small id="name-char-ct">0/100</small>
                </form-field>
    
                <form-field>
                    <horizontal-container>
                        <label for="email">email</label>
                        <small class="err-star">*</small>
                    </horizontal-container>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com" 
                        autocomplete="email" 
                        minlength="1" 
                        maxlength="100" 
                        aria-describedby="email-err"
                        aria-invalid="false"
                        required
                    >
                    <small id="email-char-ct">0/100</small>
                </form-field>
    
                <form-field>
                    <horizontal-container>
                        <label for="message">message</label>
                        <small class="err-star">*</small>
                    </horizontal-container>
                    <textarea 
                        id="message" 
                        name="message" 
                        placeholder="share your thoughts..." 
                        minlength="10" 
                        maxlength="1000" 
                        aria-describedby="msg-err" 
                        aria-invalid="false"
                        required
                    ></textarea>
                    <small id="msg-char-ct">0/1000</small>
                </form-field>
    
                <input type="hidden" name="possible_bot" value="true"> 
                <input type="hidden" name="form-errors" value=""> 
                
                <warning-field aria-live="polite">
                    <p>Warning(s):</p>
                    <p id="name-warn"></p>
                    <p id="email-warn"></p>
                    <p id="msg-warn"></p>
                </warning-field>

                <error-field aria-live="polite">
                    <p>Error(s):</p>
                    <p id="name-err"></p>
                    <p id="email-err"></p>
                    <p id="msg-err"></p>
                </error-field>

                <button id="form-submit" type="submit">send</button>
            </form>
    </footer>
    <script src="form.js" defer></script>
</body>
</html>
